name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tests that need heavy inference deps (faiss, torch, sentence-transformers)
      # skip themselves gracefully, so this stays fast and green on every push.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-dotenv

      - name: Syntax-check every source file
        run: python -m compileall -q app.py about.py evaluation tests

      - name: Run test suite
        run: pytest tests/ -v
