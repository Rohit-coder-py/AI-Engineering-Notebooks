<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="This app is live - open the Facial Emotion Recognition app">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e16"/><stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="btnclip"><rect x="300" y="128" width="400" height="56" rx="28"/></clipPath>
  </defs>
  <rect width="1000" height="220" rx="24" fill="url(#bg)"/>
  <rect x="3" y="3" width="994" height="214" rx="22" fill="none" stroke="#4ade80" stroke-width="3" opacity="0.8">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/></rect>
  <!-- pulsing live dot -->
  <circle cx="290" cy="62" r="9" fill="#4ade80"/>
  <circle cx="290" cy="62" r="9" fill="none" stroke="#4ade80" stroke-width="3">
    <animate attributeName="r" values="9;24" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="500" y="76" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="38" font-weight="900" fill="#ecfdf5"> THIS APP IS LIVE!</text>
  <text x="500" y="110" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="18" font-weight="600" fill="#bbf7d0">Try out the Facial Emotion Recognition App</text>
  <!-- button -->
  <rect x="300" y="128" width="400" height="56" rx="28" fill="url(#btn)" stroke="#bbf7d0" stroke-width="2">
    <animate attributeName="y" values="128;125;128" dur="2s" repeatCount="indefinite"/></rect>
  <g clip-path="url(#btnclip)"><rect x="-200" y="128" width="120" height="56" fill="url(#shine)" transform="skewX(-20)">
    <animate attributeName="x" values="250;800" dur="2.6s" repeatCount="indefinite"/></rect></g>
  <text x="500" y="164" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">🔗  CLICK HERE TO OPEN LIVE APP</text>
  <text x="500" y="205" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="13" fill="#86efac" letter-spacing="2">FACIAL EMOTION RECOGNITION  ·  LIVE DEPLOYMENT</text>
</svg>